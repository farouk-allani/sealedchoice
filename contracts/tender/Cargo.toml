[package]
name = "tender-contract"
description = "Sealed tender contract: rubric, sealed bids, close, evaluation result, award, escrow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

# Sandbox integration tests (tests/sandbox.rs). Versions checked 2026-11-02 (docs/references.md).
# Not on Windows: near-workspaces' build script installs a neard binary, and neard has no Windows build;
# that broke `cargo test --workspace` there. The sandbox suite runs on Linux (CI) and macOS.
[target.'cfg(not(windows))'.dev-dependencies]
near-workspaces = { version = "=0.23.0", features = ["experimental"] }  # experimental: TEMPORARY, genesis_config for diag_sandbox_clocks; 0.24 needs nearcore 0.38 crates; near-sdk 5.29.1 uses 0.37 (D-020)
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

# Sandbox integration tests start a local neard, which needs an open-file hard limit of 65535
# (fine on GitHub runners and Linux/macOS laptops, refused in Claude Code cloud containers).
# Run them with: cargo test -p tender-contract --features sandbox-tests --test sandbox
[features]
sandbox-tests = []

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"
required-features = ["sandbox-tests"]

[lints]
workspace = true
